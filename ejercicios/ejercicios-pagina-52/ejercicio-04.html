<body>

    <h1>Ejercicio Propuesto 4</h1>
    <p>Cuenta regresiva utilizando for</p>

    <script type="text/javascript">

        var countdown =
            prompt("Introduce un número para iniciar la cuenta atrás:");

        for (; countdown > 0; countdown--) {

            alert(countdown + "...");

        }

    </script>

</body>
