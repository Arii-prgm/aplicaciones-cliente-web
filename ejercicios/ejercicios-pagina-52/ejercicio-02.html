<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Propuesto 2</title>
</head>

<body>

    <h1>Ejercicio Propuesto 2</h1>
    <p>Operador lógico AND (&&)</p>

    <script type="text/javascript">

        var operando_1 =
            eval(prompt("Introduce el primer valor lógico (true o false):", true));

        var operando_2 =
            eval(prompt("Introduce el segundo valor lógico (true o false):", true));

        var resultado_logico = operando_1 && operando_2;

        alert("Resultado: " + resultado_logico);

    </script>

</body>
</html>
