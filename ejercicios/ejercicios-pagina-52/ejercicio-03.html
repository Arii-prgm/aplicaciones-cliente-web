<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Propuesto 3</title>
</head>

<body>

    <h1>Ejercicio Propuesto 3</h1>
    <p>Cuenta regresiva utilizando while</p>

    <script type="text/javascript">

        var countdown =
            prompt("Introduce un número para iniciar la cuenta atrás:");

        while (countdown > 0) {

            alert(countdown + "...");

            countdown--;
        }

    </script>

</body>
</html>
